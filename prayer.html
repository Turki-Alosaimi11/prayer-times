<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Prayer Screen</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#0b5d3b,#061f18);
    color:white;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    z-index:-1;
}

.logo{
    text-align:center;
    margin-top:10px;
}
.logo img{ width:220px; }

.title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.clock{
    text-align:center;
    font-size:48px;
    font-weight:bold;
    margin-top:5px;
}

.date{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    opacity:0.95;
}

.prayers{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:12px;
    border-radius:12px;
    min-width:120px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.2);
}

.prayer span{
    display:block;
    margin-top:5px;
    font-size:16px;
}

.countdown{
    width:420px;
    margin:25px auto;
    padding:18px;
    text-align:center;
    background:rgba(255,255,255,0.10);
    border:2px solid white;
    border-radius:15px;
}

.countdown h2{ margin:0; font-size:22px; }

.countdown .time{
    font-size:28px;
    margin-top:8px;
    font-weight:bold;
}

.ticker{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    overflow:hidden;
    padding:12px 0;
    border-top:1px solid rgba(255,255,255,0.3);
}

.ticker span{
    display:inline-block;
    white-space:nowrap;
    font-size:18px;
    padding-left:100%;
    animation: move 25s linear infinite;
}

@keyframes move{
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
}
</style>
</head>

<body>

<div class="logo">
    <img src="logo.png">
</div>

<div class="title">مؤسسة رسملة للتسويق والمقاولات</div>

<div class="clock" id="clock">--</div>
<div class="date" id="date">--</div>

<div class="prayers">
    <div class="prayer">الفجر <span id="fajr"></span></div>
    <div class="prayer">الظهر <span id="dhuhr"></span></div>
    <div class="prayer">العصر <span id="asr"></span></div>
    <div class="prayer">المغرب <span id="maghrib"></span></div>
    <div class="prayer">العشاء <span id="isha"></span></div>
</div>

<div class="countdown">
    <h2 id="nextPrayer">الصلاة القادمة</h2>
    <div class="time" id="countdown">--:--:--</div>
</div>

<div class="ticker">
    <span>
        سبحان الله • الحمد لله • لا إله إلا الله • الله أكبر • أستغفر الله • سبحان الله العظيم • الحمد لله رب العالمين • لا حول ولا قوة إلا الله • اللهم صل وسلم على نبينا محمد • أستغفر الله العظيم وأتوب إليه •
    </span>
</div>

<audio id="adhan" src="adhan.mp3"></audio>

<script>

let times = {};
let lastPlayed = "";
let prayerMode = false;
let prayerModeEnd = 0;

/* تحميل المواقيت */
async function loadTimes(){
    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4");
    const data = await res.json();
    const t = data.data.timings;

    times = {
        fajr: t.Fajr,
        dhuhr: t.Dhuhr,
        asr: t.Asr,
        maghrib: t.Maghrib,
        isha: t.Isha
    };

    document.getElementById("fajr").innerText = to12(t.Fajr);
    document.getElementById("dhuhr").innerText = to12(t.Dhuhr);
    document.getElementById("asr").innerText = to12(t.Asr);
    document.getElementById("maghrib").innerText = to12(t.Maghrib);
    document.getElementById("isha").innerText = to12(t.Isha);
}

/* الوقت */
function updateClock(){
    let d = new Date();

    let h = d.getHours();
    let m = d.getMinutes();
    let s = d.getSeconds();
    let ampm = h>=12?"PM":"AM";

    h = h%12 || 12;

    document.getElementById("clock").innerText =
    `${h}:${m}:${s} ${ampm}`;
}

/* التاريخ */
function updateDate(){
    let d = new Date();

    let day = d.toLocaleDateString('ar', {weekday:'long'});
    let greg = d.toLocaleDateString("en-GB");

    document.getElementById("date").innerText =
    `${day} | ميلادي: ${greg}`;
}

/* تحويل */
function to12(t){
    let [h,m] = t.split(":").map(Number);
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;
    return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

/* العد + الأذان */
function updateCountdown(){

    let now = new Date();
    let secNow = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();

    let nextSec = Infinity;
    let nextName = "";

    for(let p in times){
        let [h,m] = times[p].split(":").map(Number);
        let sec = h*3600 + m*60;

        if(sec > secNow && sec < nextSec){
            nextSec = sec;
            nextName = p;
        }
    }

    if(nextName){

        let diff = nextSec - secNow;

        let h = Math.floor(diff/3600);
        let m = Math.floor((diff%3600)/60);
        let s = diff%60;

        let arabicName = {
            fajr:"الفجر",
            dhuhr:"الظهر",
            asr:"العصر",
            maghrib:"المغرب",
            isha:"العشاء"
        };

        document.getElementById("nextPrayer").innerText =
        "الصلاة القادمة: " + arabicName[nextName];

        document.getElementById("countdown").innerText =
        `${h} ساعة : ${m} دقيقة : ${s} ثانية`;

        /* قبل الصلاة بـ 5 دقائق */
        if(diff <= 300 && diff > 0){
            prayerMode = true;
            prayerModeEnd = Date.now() + (30 * 60 * 1000);
        }

        /* الأذان */
        if(diff <= 1 && diff >= 0 && lastPlayed !== nextName){
            document.getElementById("adhan").play();
            lastPlayed = nextName;
        }
    }
}

/* 🔴 الحل الصحيح للانتقال */
function smartRedirect(){

    let now = new Date();
    let secNow = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();

    let nextSec = Infinity;

    for(let p in times){
        let [h,m] = times[p].split(":").map(Number);
        let sec = h*3600 + m*60;

        if(sec > secNow && sec < nextSec){
            nextSec = sec;
        }
    }

    if(nextSec === Infinity) return;

    let diff = nextSec - secNow;

    if(diff > 600){
        window.location.href = "index.html";
    }
}

setInterval(smartRedirect, 60000);

/* تشغيل */
function start(){
    loadTimes();
    updateClock();
    updateDate();

    setInterval(updateClock,1000);
    setInterval(updateCountdown,1000);
}

start();

</script>

</body>
</html>
