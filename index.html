<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Rasmalah Dashboard</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#0b5d3b,#061f18);
    color:white;
    overflow:hidden;
}

/* طبقة خفيفة */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    z-index:-1;
}

/* الأعلى */
.header{
    text-align:center;
    padding-top:10px;
}

.header img{
    width:180px;
}

/* العنوان */
.title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:5px;
}

/* الساعة */
.clock{
    text-align:center;
    font-size:32px;
    margin-top:5px;
}

/* المواقيت */
.prayers{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:10px;
    border-radius:10px;
    min-width:110px;
    text-align:center;
    transition:0.3s;
}

.prayer.active{
    background:#22c55e;
    transform:scale(1.1);
}

/* الصورة الوسط */
.center-img{
    display:flex;
    justify-content:center;
    margin-top:15px;
}

.center-img img{
    width:55%;
    max-width:650px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* العد التنازلي */
.countdown{
    text-align:center;
    margin-top:10px;
    font-size:18px;
}

/* الشريط السفلي */
.footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    padding:10px;
    font-size:18px;
    white-space:nowrap;
    overflow:hidden;
}

.scroll{
    display:inline-block;
    animation: move 20s linear infinite;
}

@keyframes move{
    from{transform:translateX(100%);}
    to{transform:translateX(-100%);}
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png">
</div>

<div class="title">مؤسسة رسملة للتسويق والمقاولات</div>
<div class="clock" id="clock">--</div>

<!-- مواقيت -->
<div class="prayers">
    <div class="prayer" id="fajr"><div>الفجر</div><span></span></div>
    <div class="prayer" id="dhuhr"><div>الظهر</div><span></span></div>
    <div class="prayer" id="asr"><div>العصر</div><span></span></div>
    <div class="prayer" id="maghrib"><div>المغرب</div><span></span></div>
    <div class="prayer" id="isha"><div>العشاء</div><span></span></div>
</div>

<!-- الصورة في الوسط -->
<div class="center-img">
    <img src="m.png">
</div>

<!-- العد -->
<div class="countdown" id="countdown">
    الصلاة القادمة...
</div>

<audio id="adhan" src="adhan.mp3"></audio>

<!-- شريط سفلي -->
<div class="footer">
    <div class="scroll">
        سبحان الله • الحمد لله • لا إله إلا الله • الله أكبر • استغفر الله • اللهم صل وسلم على نبينا محمد
    </div>
</div>

<script>

let times = {};
let lastPlayed = {};
let unlocked = false;

/* تشغيل الصوت */
document.addEventListener("click", () => {
    const audio = document.getElementById("adhan");
    audio.play().then(()=>{
        audio.pause();
        audio.currentTime = 0;
        unlocked = true;
    }).catch(()=>{});
});

/* تشغيل الأذان */
function playAdhan(prayer){
    if(!unlocked) return;

    const audio = document.getElementById("adhan");
    audio.currentTime = 0;
    audio.play().catch(()=>{});
}

/* الوقت بالدقائق */
function nowMin(){
    let d = new Date();
    return d.getHours()*60 + d.getMinutes();
}

/* تحويل */
function toMin(t){
    let [h,m] = t.split(":").map(Number);
    return h*60 + m;
}

/* العد التنازلي */
function updateCountdown(){
    let now = nowMin();

    let next = null;
    let nextT = null;

    for(let p in times){
        let t = toMin(times[p]);
        if(t > now){
            next = p;
            nextT = t;
            break;
        }
    }

    if(next){
        let diff = nextT - now;
        let h = Math.floor(diff/60);
        let m = diff%60;

        document.getElementById("countdown").innerText =
        `الصلاة القادمة: ${next} خلال ${h} ساعة و ${m} دقيقة`;
    }
}

/* فحص الأذان */
function check(){
    let now = new Date();
    let current =
        now.getHours().toString().padStart(2,'0') + ":" +
        now.getMinutes().toString().padStart(2,'0');

    for(let p in times){
        if(times[p] === current && !lastPlayed[p]){
            playAdhan(p);
            lastPlayed[p] = true;
        }
    }

    updateCountdown();
}

/* تحميل المواقيت */
async function loadTimes(){
    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4");
    const data = await res.json();
    const t = data.data.timings;

    times = {
        Fajr: t.Fajr,
        Dhuhr: t.Dhuhr,
        Asr: t.Asr,
        Maghrib: t.Maghrib,
        Isha: t.Isha
    };

    for(let p in times){
        let el = document.getElementById(p.toLowerCase());
        if(el){
            el.querySelector("span").innerText = times[p];
        }
    }
}

/* الساعة */
function updateClock(){
    let d = new Date();
    let h = d.getHours();
    let m = d.getMinutes();
    let ampm = h>=12?"PM":"AM";

    h = h%12 || 12;

    document.getElementById("clock").innerText =
    `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

/* تشغيل */
function start(){
    loadTimes();
    updateClock();

    setInterval(updateClock,1000);
    setInterval(check,10000);
}

start();

</script>

</body>
</html>
