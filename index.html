<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Rasmalah Screen</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#0b5d3b,#061f18);
    color:white;
    overflow:hidden;
}

/* خلفية ضبابية */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    z-index:-1;
}

/* الشعار */
.logo{
    text-align:center;
    margin-top:8px;
}
.logo img{
    width:150px;
}

/* العنوان */
.title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

/* الساعة */
.clock{
    text-align:center;
    font-size:34px;
}

/* التاريخ */
.date{
    text-align:center;
    font-size:14px;
    opacity:0.9;
}

/* 🔵 العد التنازلي (أعلى يسار) */
.countdown-box{
    position:absolute;
    top:15px;
    left:15px;
    width:260px;
    padding:12px;
    background:rgba(255,255,255,0.08);
    border:1px solid white;
    border-radius:12px;
    font-size:14px;
}

/* 🔴 المواقيت (أعلى يمين مربعات) */
.prayers{
    position:absolute;
    top:15px;
    right:15px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:8px;
    border-radius:10px;
    min-width:140px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.3);
}

/* 🟡 مربع الصورة في المنتصف */
.hero{
    display:flex;
    justify-content:center;
    margin-top:80px;
}

.hero-box{
    width:70%;
    height:380px;
    border:2px solid white;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:rgba(255,255,255,0.05);
}

.hero-box img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

/* الشريط السفلي */
.footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    padding:10px;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
}

.scroll{
    display:inline-block;
    animation:move 25s linear infinite;
}

@keyframes move{
    from{transform:translateX(100%);}
    to{transform:translateX(-100%);}
}
</style>
</head>

<body>

<!-- الشعار -->
<div class="logo">
    <img src="logo.png">
</div>

<div class="title">مؤسسة رسملة للتسويق والمقاولات</div>

<div class="clock" id="clock"></div>
<div class="date" id="date"></div>

<!-- 🔵 العد التنازلي -->
<div class="countdown-box" id="countdown">
    الصلاة القادمة...
</div>

<!-- 🔴 المواقيت -->
<div class="prayers">
    <div class="prayer" id="fajr">الفجر <br> <span></span></div>
    <div class="prayer" id="dhuhr">الظهر <br> <span></span></div>
    <div class="prayer" id="asr">العصر <br> <span></span></div>
    <div class="prayer" id="maghrib">المغرب <br> <span></span></div>
    <div class="prayer" id="isha">العشاء <br> <span></span></div>
</div>

<!-- 🟡 الصورة في المنتصف -->
<div class="hero">
    <div class="hero-box">
        <img src="m.png">
    </div>
</div>

<!-- الصوت -->
<audio id="adhan" src="adhan.mp3"></audio>

<!-- الشريط -->
<div class="footer">
    <div class="scroll">
        سبحان الله • الحمد لله • لا إله إلا الله • الله أكبر • استغفر الله • اللهم صل وسلم على نبينا محمد
    </div>
</div>

<script>

let times = {};
let lastPlayed = "";
let unlocked = false;

/* تشغيل الصوت */
document.addEventListener("click", () => {
    const a = document.getElementById("adhan");
    a.play().then(()=>{
        a.pause();
        a.currentTime = 0;
        unlocked = true;
    }).catch(()=>{});
});

/* تحويل 12 ساعة */
function to12(t){
    let [h,m] = t.split(":").map(Number);
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;
    return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

/* الساعة */
function updateClock(){
    let d = new Date();
    let h = d.getHours();
    let m = d.getMinutes();
    let s = d.getSeconds();
    let ampm = h>=12?"PM":"AM";

    h = h%12 || 12;

    document.getElementById("clock").innerText =
    `${h}:${m}:${s} ${ampm}`;
}

/* التاريخ */
function updateDate(){
    let d = new Date();

    let greg = d.toLocaleDateString("en-GB");

    let hijri = new Intl.DateTimeFormat('ar-TN-u-ca-islamic',{
        day:'numeric',month:'long',year:'numeric'
    }).format(d);

    let day = d.toLocaleDateString('ar',{weekday:'long'});

    document.getElementById("date").innerText =
    `${day} | ميلادي: ${greg} | هجري: ${hijri}`;
}

/* تحميل المواقيت */
async function loadTimes(){
    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4");
    const data = await res.json();
    const t = data.data.timings;

    times = {
        Fajr: t.Fajr,
        Dhuhr: t.Dhuhr,
        Asr: t.Asr,
        Maghrib: t.Maghrib,
        Isha: t.Isha
    };

    for(let p in times){
        document.getElementById(p.toLowerCase()).querySelector("span").innerText = to12(times[p]);
    }
}

/* 🔵 العد + تشغيل الأذان عند الصفر */
function countdown(){
    let now = new Date();
    let sec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();

    let next = null;
    let nextSec = null;

    for(let p in times){
        let [h,m] = times[p].split(":").map(Number);
        let t = h*3600 + m*60;

        if(t > sec){
            next = p;
            nextSec = t;
            break;
        }
    }

    if(next){
        let diff = nextSec - sec;

        let h = Math.floor(diff/3600);
        let m = Math.floor((diff%3600)/60);
        let s = diff%60;

        document.getElementById("countdown").innerText =
        `الصلاة القادمة: ${next} خلال ${h} ساعة ${m} دقيقة ${s} ثانية`;

        if(diff === 0 && lastPlayed !== next && unlocked){
            const a = document.getElementById("adhan");
            a.currentTime = 0;
            a.play();
            lastPlayed = next;
        }
    }
}

/* تشغيل النظام */
function start(){
    loadTimes();
    updateClock();
    updateDate();

    setInterval(updateClock,1000);
    setInterval(countdown,1000);
}

start();

</script>

</body>
</html>
