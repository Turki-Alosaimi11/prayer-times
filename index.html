<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Rasmalah | رسملة</title>

<style>
body{
    margin:0;
    font-family: Arial;
    color:white;
    background: linear-gradient(135deg,#0b5d3b,#06281f);
    overflow:hidden;
}

/* خلفية ضبابية */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    z-index:-1;
}

/* الشعار */
.logo{
    text-align:center;
    margin-top:15px;
}

.logo img{
    width:200px;
    filter: drop-shadow(0 0 12px #0b5d3b);
}

/* العنوان */
.title{
    text-align:center;
    font-size:26px;
    margin-top:5px;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    font-size:18px;
    opacity:0.8;
}

/* الساعة */
.clock{
    text-align:center;
    font-size:34px;
    margin-top:10px;
    font-weight:bold;
}

/* التاريخ */
.date{
    text-align:center;
    font-size:18px;
    margin-top:5px;
    opacity:0.9;
}

/* المواقيت */
.box{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:12px;
    border-radius:12px;
    min-width:110px;
    text-align:center;
}

.prayer.active{
    background:#22c55e;
}

/* مستطيل العد التنازلي */
#countdown{
    text-align:center;
    margin:20px auto;
    padding:15px;
    width:320px;
    background:rgba(255,255,255,0.1);
    border-radius:12px;
    font-size:18px;
}

/* الأذكار */
.ticker{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    padding:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="logo">
    <img src="logo.png">
</div>

<div class="title">مؤسسة رسملة للتسويق والمقاولات</div>
<div class="subtitle">Rasmalah Company for Marketing & Contracting</div>

<div class="clock" id="clock">--</div>
<div class="date" id="date">--</div>

<div id="countdown">الصلاة القادمة...</div>

<div class="box">
    <div class="prayer" id="fajr"><h3>الفجر</h3><span></span></div>
    <div class="prayer" id="dhuhr"><h3>الظهر</h3><span></span></div>
    <div class="prayer" id="asr"><h3>العصر</h3><span></span></div>
    <div class="prayer" id="maghrib"><h3>المغرب</h3><span></span></div>
    <div class="prayer" id="isha"><h3>العشاء</h3><span></span></div>
</div>

<audio id="adhan" src="adhan.mp3" preload="auto"></audio>

<div class="ticker">
<marquee>
سبحان الله | الحمد لله | لا إله إلا الله | الله أكبر | استغفر الله
</marquee>
</div>

<script>

let times = {};
let lastPlayed = "";
let unlocked = false;

/* فتح الصوت */
document.addEventListener("click", () => {
    const audio = document.getElementById("adhan");

    audio.play().then(()=>{
        audio.pause();
        audio.currentTime = 0;
        unlocked = true;
    }).catch(()=>{});
});

/* تشغيل الأذان */
function playAdhan(){
    if(!unlocked) return;

    const audio = document.getElementById("adhan");
    audio.currentTime = 0;
    audio.play().catch(()=>{});
}

/* الوقت الحالي */
function getNow(){
    let d = new Date();
    return d.getHours()*60 + d.getMinutes();
}

/* تحويل الوقت */
function toMin(t){
    let [h,m] = t.split(":").map(Number);
    return h*60 + m;
}

/* العد التنازلي */
function updateCountdown(){
    let now = getNow();

    let next = null;
    let nextTime = null;

    for(let p in times){
        let t = toMin(times[p]);
        if(t > now){
            next = p;
            nextTime = t;
            break;
        }
    }

    if(next){
        let diff = nextTime - now;
        let h = Math.floor(diff/60);
        let m = diff%60;

        document.getElementById("countdown").innerText =
        `الصلاة القادمة: ${next} خلال ${h} ساعة و ${m} دقيقة`;
    }
}

/* فحص الأذان */
function check(){
    let now = new Date();
    let current =
        now.getHours().toString().padStart(2,'0') + ":" +
        now.getMinutes().toString().padStart(2,'0');

    for(let p in times){
        if(times[p] === current && lastPlayed !== p){
            playAdhan();
            lastPlayed = p;
        }
    }

    updateCountdown();
}

/* تحميل المواقيت */
async function loadTimes(){
    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4");
    const data = await res.json();
    const t = data.data.timings;

    times = {
        Fajr: t.Fajr,
        Dhuhr: t.Dhuhr,
        Asr: t.Asr,
        Maghrib: t.Maghrib,
        Isha: t.Isha
    };

    for(let p in times){
        let el = document.getElementById(p.toLowerCase());
        if(el){
            el.querySelector("span").innerText = times[p];
        }
    }
}

/* ساعة */
function updateClock(){
    let d = new Date();
    let h = d.getHours();
    let m = d.getMinutes();
    let ampm = h>=12?"PM":"AM";

    h = h%12 || 12;

    document.getElementById("clock").innerText =
    `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

/* تاريخ */
function updateDate(){
    let d = new Date();
    document.getElementById("date").innerText =
    d.toLocaleDateString("ar-SA");
}

/* تشغيل */
function start(){
    loadTimes();
    updateClock();
    updateDate();

    setInterval(updateClock,1000);
    setInterval(check,10000);
}

start();

</script>

</body>
</html>
