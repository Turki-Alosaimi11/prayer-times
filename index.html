<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة - الرياض</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Tahoma, Arial;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.clock{
    font-size:60px;
    font-weight:bold;
}

.date{
    font-size:24px;
    margin-top:10px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:25px;
    text-align:center;
}

.card h3{
    margin:0;
    font-size:28px;
}

.card p{
    margin-top:15px;
    font-size:32px;
    color:#38bdf8;
}

.next-prayer{
    margin-top:30px;
    text-align:center;
    background:#14532d;
    padding:20px;
    border-radius:15px;
    font-size:30px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
</div>

<div class="cards">
    <div class="card"><h3>الفجر</h3><p id="Fajr">--:--</p></div>
    <div class="card"><h3>الشروق</h3><p id="Sunrise">--:--</p></div>
    <div class="card"><h3>الظهر</h3><p id="Dhuhr">--:--</p></div>
    <div class="card"><h3>العصر</h3><p id="Asr">--:--</p></div>
    <div class="card"><h3>المغرب</h3><p id="Maghrib">--:--</p></div>
    <div class="card"><h3>العشاء</h3><p id="Isha">--:--</p></div>
</div>

<div class="next-prayer" id="nextPrayer">
جاري تحميل مواقيت الصلاة...
</div>

</div>

<script>

function updateClock(){
    const now = new Date();

    document.getElementById("clock").innerHTML =
    now.toLocaleTimeString('ar-SA');

    document.getElementById("date").innerHTML =
    now.toLocaleDateString('ar-SA',{
        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'
    });
}

setInterval(updateClock,1000);
updateClock();

fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=Saudi%20Arabia&method=4")
.then(res=>res.json())
.then(data=>{

    const t = data.data.timings;

    document.getElementById("Fajr").innerHTML=t.Fajr;
    document.getElementById("Sunrise").innerHTML=t.Sunrise;
    document.getElementById("Dhuhr").innerHTML=t.Dhuhr;
    document.getElementById("Asr").innerHTML=t.Asr;
    document.getElementById("Maghrib").innerHTML=t.Maghrib;
    document.getElementById("Isha").innerHTML=t.Isha;

    document.getElementById("nextPrayer").innerHTML =
    "مدينة الرياض - مواقيت الصلاة اليوم";
});

</script>

</body>
</html>
