<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Rasmalah Screen</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#0b5d3b,#061f18);
    color:white;
    overflow:hidden;
}

/* خلفية ضبابية */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    z-index:-1;
}

/* 🔴 أعلى يمين (المعلومات كلها) */
.top-info{
    position:absolute;
    top:10px;
    right:20px;
    text-align:right;
    font-size:14px;
    line-height:1.8;
}

.company{
    font-size:18px;
    font-weight:bold;
}

/* الشعار */
.logo{
    text-align:center;
    margin-top:10px;
}
.logo img{
    width:140px;
}

/* الساعة */
.clock{
    text-align:center;
    font-size:34px;
    margin-top:5px;
}

/* التاريخ */
.date{
    text-align:center;
    font-size:14px;
    opacity:0.9;
}

/* المواقيت */
.prayers{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:8px;
    border-radius:10px;
    min-width:85px;
    text-align:center;
}

/* الصورة في المنتصف */
.hero{
    display:flex;
    justify-content:center;
    margin-top:15px;
}

.hero img{
    max-width:70%;
    height:auto;
    object-fit:contain;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

/* 🔥 عد تنازلي */
.countdown{
    position:absolute;
    left:20px;
    top:120px;
    width:260px;
    padding:12px;
    background:rgba(255,255,255,0.08);
    border-radius:12px;
    text-align:center;
    font-size:14px;
}

/* الشريط السفلي */
.footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    padding:10px;
    font-size:16px;
    overflow:hidden;
    white-space:nowrap;
}

.scroll{
    display:inline-block;
    animation:move 25s linear infinite;
}

@keyframes move{
    from{transform:translateX(100%);}
    to{transform:translateX(-100%);}
}
</style>
</head>

<body>

<!-- 🔴 معلومات أعلى اليمين -->
<div class="top-info">
    <div class="company">مؤسسة رسملة للتسويق والمقاولات</div>
    <div id="clock">--</div>
    <div id="date">--</div>
</div>

<!-- شعار -->
<div class="logo">
    <img src="logo.png">
</div>

<!-- المواقيت -->
<div class="prayers">
    <div class="prayer" id="fajr">الفجر<br><span></span></div>
    <div class="prayer" id="dhuhr">الظهر<br><span></span></div>
    <div class="prayer" id="asr">العصر<br><span></span></div>
    <div class="prayer" id="maghrib">المغرب<br><span></span></div>
    <div class="prayer" id="isha">العشاء<br><span></span></div>
</div>

<!-- الصورة -->
<div class="hero">
    <img src="m.png">
</div>

<!-- 🔥 عد تنازلي -->
<div class="countdown" id="countdown">
    الصلاة القادمة...
</div>

<!-- صوت الأذان -->
<audio id="adhan" src="adhan.mp3"></audio>

<!-- الشريط -->
<div class="footer">
    <div class="scroll">
        سبحان الله • الحمد لله • لا إله إلا الله • الله أكبر • استغفر الله • اللهم صل وسلم على نبينا محمد
    </div>
</div>

<script>

let times = {};
let lastPlayed = "";
let unlocked = false;

/* تشغيل الصوت */
document.addEventListener("click", () => {
    const a = document.getElementById("adhan");
    a.play().then(()=>{
        a.pause();
        a.currentTime = 0;
        unlocked = true;
    }).catch(()=>{});
});

/* 12 ساعة */
function to12(t){
    let [h,m] = t.split(":").map(Number);
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;
    return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

/* الساعة */
function updateClock(){
    let d = new Date();
    let h = d.getHours();
    let m = d.getMinutes();
    let s = d.getSeconds();
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;

    document.getElementById("clock").innerText =
    `${h}:${m}:${s} ${ampm}`;
}

/* التاريخ */
function updateDate(){
    let d = new Date();

    let greg = d.toLocaleDateString("en-GB");

    let hijri = new Intl.DateTimeFormat('ar-TN-u-ca-islamic',{
        day:'numeric',month:'long',year:'numeric'
    }).format(d);

    let day = d.toLocaleDateString('ar',{weekday:'long'});

    document.getElementById("date").innerText =
    `${day} | ميلادي: ${greg} | هجري: ${hijri}`;
}

/* تحميل المواقيت */
async function loadTimes(){
    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4");
    const data = await res.json();
    const t = data.data.timings;

    times = {
        Fajr: t.Fajr,
        Dhuhr: t.Dhuhr,
        Asr: t.Asr,
        Maghrib: t.Maghrib,
        Isha: t.Isha
    };

    for(let p in times){
        document.getElementById(p.toLowerCase()).querySelector("span").innerText = to12(times[p]);
    }
}

/* 🔥 العد التنازلي + ربط الأذان */
function countdown(){
    let now = new Date();
    let secNow = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();

    let next = null;
    let nextSec = null;

    for(let p in times){
        let [h,m] = times[p].split(":").map(Number);
        let t = h*3600 + m*60;

        if(t > secNow){
            next = p;
            nextSec = t;
            break;
        }
    }

    if(next){
        let diff = nextSec - secNow;

        let h = Math.floor(diff/3600);
        let m = Math.floor((diff%3600)/60);
        let s = diff%60;

        document.getElementById("countdown").innerText =
        `الصلاة القادمة: ${next} خلال ${h} ساعة ${m} دقيقة ${s} ثانية`;

        /* 🔥 تشغيل الأذان عند الصفر */
        if(diff === 0 && lastPlayed !== next && unlocked){
            const a = document.getElementById("adhan");
            a.currentTime = 0;
            a.play();
            lastPlayed = next;
        }
    }
}

/* تشغيل */
function start(){
    loadTimes();
    updateClock();
    updateDate();

    setInterval(updateClock,1000);
    setInterval(countdown,1000);
}

start();

</script>

</body>
</html>
