<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Rasmalah Screen</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#0b5d3b,#061f18);
    color:white;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    z-index:-1;
}

/* العنوان */
.title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:10px;
}

.subtitle{
    text-align:center;
    font-size:16px;
    opacity:0.8;
}

/* الساعة */
.clock{
    text-align:center;
    font-size:40px;
    margin-top:5px;
    font-weight:bold;
}

/* التاريخ */
.date{
    text-align:center;
    font-size:16px;
    margin-top:5px;
}

/* المواقيت */
.prayers{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:10px;
    border-radius:10px;
    min-width:110px;
    text-align:center;
}

.prayer.active{
    background:#22c55e;
}

/* الصورة الكبيرة */
.hero{
    display:flex;
    justify-content:center;
    margin-top:10px;
}

.hero img{
    width:70%;
    max-width:900px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

/* العد التنازلي */
.countdown{
    text-align:center;
    margin-top:10px;
    font-size:20px;
    background:rgba(255,255,255,0.08);
    width:400px;
    margin:auto;
    padding:12px;
    border-radius:10px;
}

/* الشريط */
.footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    padding:10px;
    font-size:18px;
    overflow:hidden;
}

.scroll{
    display:inline-block;
    white-space:nowrap;
    animation:move 25s linear infinite;
}

@keyframes move{
    from{transform:translateX(100%);}
    to{transform:translateX(-100%);}
}
</style>
</head>

<body>

<div class="title">مؤسسة رسملة للتسويق والمقاولات</div>
<div class="subtitle">Rasmalah Contracting & Marketing</div>

<div class="clock" id="clock">--</div>
<div class="date" id="date">--</div>

<!-- المواقيت -->
<div class="prayers">
    <div class="prayer" id="fajr"><div>الفجر</div><span></span></div>
    <div class="prayer" id="dhuhr"><div>الظهر</div><span></span></div>
    <div class="prayer" id="asr"><div>العصر</div><span></span></div>
    <div class="prayer" id="maghrib"><div>المغرب</div><span></span></div>
    <div class="prayer" id="isha"><div>العشاء</div><span></span></div>
</div>

<!-- الصورة -->
<div class="hero">
    <img src="m.png">
</div>

<!-- العد -->
<div class="countdown" id="countdown">الصلاة القادمة...</div>

<audio id="adhan" src="adhan.mp3"></audio>

<!-- الشريط -->
<div class="footer">
    <div class="scroll">
        سبحان الله • الحمد لله • لا إله إلا الله • الله أكبر • استغفر الله • اللهم صل وسلم على نبينا محمد
    </div>
</div>

<script>

let times = {};
let lastPlayed = "";
let unlocked = false;

/* تشغيل الصوت */
document.addEventListener("click", () => {
    const a = document.getElementById("adhan");
    a.play().then(()=>{
        a.pause();
        a.currentTime = 0;
        unlocked = true;
    }).catch(()=>{});
});

/* الوقت 12H */
function format12(){
    let d = new Date();
    let h = d.getHours();
    let m = d.getMinutes();
    let s = d.getSeconds();
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;
    return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')} ${ampm}`;
}

/* تحديث الساعة */
function updateClock(){
    document.getElementById("clock").innerText = format12();
}

/* التاريخ هجري + ميلادي + يوم */
function updateDate(){
    let d = new Date();
    let greg = d.toLocaleDateString("en-GB");
    let hijri = new Intl.DateTimeFormat('ar-TN-u-ca-islamic', {
        day:'numeric',
        month:'long',
        year:'numeric'
    }).format(d);

    let day = d.toLocaleDateString('ar', {weekday:'long'});

    document.getElementById("date").innerText =
    `${day} | ميلادي: ${greg} | هجري: ${hijri}`;
}

/* تحميل الصلاة */
async function load(){
    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4");
    const data = await res.json();
    const t = data.data.timings;

    times = {
        Fajr: t.Fajr,
        Dhuhr: t.Dhuhr,
        Asr: t.Asr,
        Maghrib: t.Maghrib,
        Isha: t.Isha
    };

    for(let p in times){
        document.getElementById(p.toLowerCase()).querySelector("span").innerText = to12(times[p]);
    }
}

/* تحويل 12 ساعة */
function to12(t){
    let [h,m] = t.split(":").map(Number);
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;
    return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

/* العد التنازلي + ثواني */
function countdown(){
    let now = new Date();
    let nowMin = now.getHours()*60 + now.getMinutes();
    let nowSec = nowMin*60 + now.getSeconds();

    let next = null;
    let nextSec = null;

    for(let p in times){
        let [h,m] = times[p].split(":").map(Number);
        let t = (h*60 + m)*60;

        if(t > nowSec){
            next = p;
            nextSec = t;
            break;
        }
    }

    if(next){
        let diff = nextSec - nowSec;

        let h = Math.floor(diff/3600);
        let m = Math.floor((diff%3600)/60);
        let s = diff%60;

        document.getElementById("countdown").innerText =
        `الصلاة القادمة: ${next} خلال ${h} ساعة ${m} دقيقة ${s} ثانية`;
    }
}

/* تشغيل الأذان */
function check(){
    let now = new Date();
    let current =
        now.getHours().toString().padStart(2,'0') + ":" +
        now.getMinutes().toString().padStart(2,'0');

    for(let p in times){
        if(times[p] === current && lastPlayed !== p){
            if(unlocked){
                let audio = document.getElementById("adhan");
                audio.currentTime = 0;
                audio.play();
            }
            lastPlayed = p;
        }
    }

    countdown();
}

/* تشغيل */
function start(){
    load();
    updateClock();
    updateDate();

    setInterval(updateClock,1000);
    setInterval(check,1000);
}

start();

</script>

</body>
</html>
