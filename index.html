<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام الأذان</title>

<style>
body{
    margin:0;
    font-family: Arial;
    color:white;
    background:url('bg.jpg') center/cover no-repeat;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    z-index:-1;
}

.logo{
    text-align:center;
    margin-top:15px;
}
.logo img{
    width:200px;
    filter: drop-shadow(0 0 10px #0b5d3b);
}

.title{
    text-align:center;
    font-size:24px;
    margin-top:10px;
}

.clock{
    text-align:center;
    font-size:32px;
    margin-top:10px;
    font-weight:bold;
}

.date{
    text-align:center;
    opacity:0.9;
}

.countdown{
    width:300px;
    margin:20px auto;
    text-align:center;
    background:rgba(255,255,255,0.08);
    padding:15px;
    border-radius:15px;
}

.countdown span{
    font-size:22px;
    font-weight:bold;
}

.box{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:12px;
    border-radius:10px;
    min-width:110px;
    text-align:center;
}

.prayer.active{
    background:#22c55e;
}

.ticker{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    padding:10px;
}
</style>
</head>

<body>

<div class="logo">
    <img src="logo.png">
</div>

<div class="title">مؤسسة رسملة</div>

<div class="clock" id="clock">--</div>
<div class="date" id="date"></div>

<div class="countdown">
    الصلاة القادمة: <span id="next">--</span><br>
    <span id="timeLeft">--</span>
</div>

<div class="box">
    <div class="prayer" id="fajr"><h3>الفجر</h3><span></span></div>
    <div class="prayer" id="dhuhr"><h3>الظهر</h3><span></span></div>
    <div class="prayer" id="asr"><h3>العصر</h3><span></span></div>
    <div class="prayer" id="maghrib"><h3>المغرب</h3><span></span></div>
    <div class="prayer" id="isha"><h3>العشاء</h3><span></span></div>
</div>

<audio id="adhan" src="adhan.mp3"></audio>

<div class="ticker">
<marquee>سبحان الله وبحمده</marquee>
</div>

<script>

let times = {};
let lastPlayed = "";

function format12(date){
    let h=date.getHours();
    let m=date.getMinutes();
    let ampm=h>=12?"PM":"AM";
    h=h%12||12;
    return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

function updateClock(){
    document.getElementById("clock").innerText = format12(new Date());
}

async function load(){
    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4");
    const data = await res.json();
    const t = data.data.timings;

    times = {
        Fajr: t.Fajr,
        Dhuhr: t.Dhuhr,
        Asr: t.Asr,
        Maghrib: t.Maghrib,
        Isha: t.Isha
    };

    for(let p in times){
        document.getElementById(p.toLowerCase()).querySelector("span").innerText = times[p];
    }
}

function toMinutes(t){
    let [h,m] = t.split(":").map(Number);
    return h*60 + m;
}

function check(){
    let now = new Date();
    let nowMin = now.getHours()*60 + now.getMinutes();

    let nextPrayer = null;
    let nextTime = null;

    for(let p in times){
        let tMin = toMinutes(times[p]);

        if(tMin === nowMin){
            if(lastPlayed !== p){
                document.getElementById("adhan").play().catch(()=>{});
                lastPlayed = p;
            }
        }

        if(tMin > nowMin && !nextPrayer){
            nextPrayer = p;
            nextTime = tMin;
        }
    }

    if(nextPrayer){
        document.getElementById("next").innerText = nextPrayer;

        let diff = nextTime - nowMin;
        document.getElementById("timeLeft").innerText =
            diff + " دقيقة متبقية";
    }
}

setInterval(updateClock,1000);
setInterval(check,10000);

updateClock();
load();

</script>

</body>
</html>
