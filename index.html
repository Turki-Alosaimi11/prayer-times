<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Rasmalah Screen</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#0b5d3b,#061f18);
    color:white;
    overflow:hidden;
}

/* الخلفية الضبابية */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    z-index:-1;
}

/* الشعار */
.logo{
    text-align:center;
    margin-top:10px;
}
.logo img{
    width:180px;
}

/* العنوان */
.title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

/* الساعة */
.clock{
    text-align:center;
    font-size:38px;
    margin-top:5px;
}

/* التاريخ */
.date{
    text-align:center;
    font-size:16px;
    margin-top:5px;
}

/* المواقيت */
.prayers{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:10px;
    border-radius:10px;
    min-width:100px;
    text-align:center;
}

.prayer.active{
    background:#22c55e;
}

/* الصورة الكبيرة (بدون قص) */
.hero{
    display:flex;
    justify-content:center;
    margin-top:10px;
}

.hero img{
    width:85%;
    max-width:1200px;
    height:auto;
    object-fit:contain;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

/* العد التنازلي */
.countdown{
    text-align:center;
    margin-top:10px;
    font-size:18px;
    background:rgba(255,255,255,0.08);
    width:420px;
    margin-left:auto;
    margin-right:auto;
    padding:12px;
    border-radius:10px;
}

/* الشريط السفلي */
.footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    padding:10px;
    font-size:18px;
    overflow:hidden;
    white-space:nowrap;
}

.scroll{
    display:inline-block;
    animation:move 25s linear infinite;
}

@keyframes move{
    from{transform:translateX(100%);}
    to{transform:translateX(-100%);}
}
</style>
</head>

<body>

<!-- الشعار -->
<div class="logo">
    <img src="logo.png">
</div>

<div class="title">مؤسسة رسملة للتسويق والمقاولات</div>

<div class="clock" id="clock">--</div>
<div class="date" id="date">--</div>

<!-- المواقيت -->
<div class="prayers">
    <div class="prayer" id="fajr"><div>الفجر</div><span></span></div>
    <div class="prayer" id="dhuhr"><div>الظهر</div><span></span></div>
    <div class="prayer" id="asr"><div>العصر</div><span></span></div>
    <div class="prayer" id="maghrib"><div>المغرب</div><span></span></div>
    <div class="prayer" id="isha"><div>العشاء</div><span></span></div>
</div>

<!-- الصورة -->
<div class="hero">
    <img src="m.png">
</div>

<!-- العد التنازلي -->
<div class="countdown" id="countdown">
    الصلاة القادمة...
</div>

<!-- الصوت -->
<audio id="adhan" src="adhan.mp3"></audio>

<!-- الشريط السفلي -->
<div class="footer">
    <div class="scroll">
        سبحان الله • الحمد لله • لا إله إلا الله • الله أكبر • استغفر الله • اللهم صل وسلم على نبينا محمد
    </div>
</div>

<script>

let times = {};
let lastPlayed = "";
let unlocked = false;

/* فتح الصوت */
document.addEventListener("click", () => {
    const audio = document.getElementById("adhan");

    audio.play().then(()=>{
        audio.pause();
        audio.currentTime = 0;
        unlocked = true;
    }).catch(()=>{});
});

/* تشغيل الأذان */
function playAdhan(){
    if(!unlocked) return;

    const audio = document.getElementById("adhan");
    audio.currentTime = 0;
    audio.play().catch(()=>{});
}

/* الوقت الحالي بالثواني */
function nowSeconds(){
    let d = new Date();
    return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
}

/* تحويل */
function toSeconds(t){
    let [h,m] = t.split(":").map(Number);
    return h*3600 + m*60;
}

/* العد التنازلي */
function countdown(){
    let now = nowSeconds();

    let next = null;
    let nextT = null;

    for(let p in times){
        let t = toSeconds(times[p]);
        if(t > now){
            next = p;
            nextT = t;
            break;
        }
    }

    if(next){
        let diff = nextT - now;

        let h = Math.floor(diff/3600);
        let m = Math.floor((diff%3600)/60);
        let s = diff%60;

        document.getElementById("countdown").innerText =
        `الصلاة القادمة: ${next} خلال ${h} ساعة ${m} دقيقة ${s} ثانية`;
    }
}

/* فحص الأذان */
function check(){
    let now = new Date();
    let current =
        now.getHours().toString().padStart(2,'0') + ":" +
        now.getMinutes().toString().padStart(2,'0');

    for(let p in times){
        if(times[p] === current && lastPlayed !== p){
            playAdhan();
            lastPlayed = p;
        }
    }

    countdown();
}

/* تحميل المواقيت */
async function loadTimes(){
    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4");
    const data = await res.json();
    const t = data.data.timings;

    times = {
        Fajr: t.Fajr,
        Dhuhr: t.Dhuhr,
        Asr: t.Asr,
        Maghrib: t.Maghrib,
        Isha: t.Isha
    };

    for(let p in times){
        let el = document.getElementById(p.toLowerCase());
        if(el){
            el.querySelector("span").innerText = to12(times[p]);
        }
    }
}

/* 12 ساعة */
function to12(t){
    let [h,m] = t.split(":").map(Number);
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;
    return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

/* الساعة */
function updateClock(){
    let d = new Date();
    let h = d.getHours();
    let m = d.getMinutes();
    let ampm = h>=12?"PM":"AM";

    h = h%12 || 12;

    document.getElementById("clock").innerText =
    `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

/* التاريخ */
function updateDate(){
    let d = new Date();

    let greg = d.toLocaleDateString("en-GB");

    let hijri = new Intl.DateTimeFormat('ar-TN-u-ca-islamic', {
        day:'numeric',
        month:'long',
        year:'numeric'
    }).format(d);

    let day = d.toLocaleDateString('ar', {weekday:'long'});

    document.getElementById("date").innerText =
    `${day} | ميلادي: ${greg} | هجري: ${hijri}`;
}

/* تشغيل */
function start(){
    loadTimes();
    updateClock();
    updateDate();

    setInterval(updateClock,1000);
    setInterval(check,1000);
}

start();

</script>

</body>
</html>
