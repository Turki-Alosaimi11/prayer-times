<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مؤسسة رسملة</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0f172a,#0b5d3b);
    color:white;
}

/* الشعار */
.logo-container{
    text-align:center;
    padding-top:20px;
}

.logo-container img{
    width:250px;
    max-width:80%;
}

/* العنوان */
.title{
    text-align:center;
    font-size:28px;
    margin-top:10px;
    font-weight:bold;
}

/* صندوق المواقيت */
.prayer-box{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:30px;
    gap:15px;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:15px 25px;
    border-radius:12px;
    text-align:center;
    min-width:120px;
}

.prayer h3{
    margin:0;
    font-size:18px;
}

.prayer span{
    font-size:20px;
    font-weight:bold;
    display:block;
    margin-top:5px;
}

/* شريط الأخبار */
.ticker{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    color:#fff;
    padding:10px;
    font-size:20px;
}

/* التاريخ */
.date{
    text-align:center;
    margin-top:10px;
    font-size:18px;
    opacity:0.9;
}
</style>
</head>

<body>

<div class="logo-container">
    <img src="logo.png" alt="شعار المؤسسة">
</div>

<div class="title">مؤسسة رسملة للتسويق والمقاولات</div>

<div class="date" id="date"></div>

<div class="prayer-box">
    <div class="prayer"><h3>الفجر</h3><span>05:00</span></div>
    <div class="prayer"><h3>الظهر</h3><span>12:10</span></div>
    <div class="prayer"><h3>العصر</h3><span>15:30</span></div>
    <div class="prayer"><h3>المغرب</h3><span>18:05</span></div>
    <div class="prayer"><h3>العشاء</h3><span>19:30</span></div>
</div>

<div class="ticker">
<marquee direction="right">
مرحباً بكم في مؤسسة رسملة للتسويق والمقاولات - نسأل الله لكم يوماً موفقاً ومليئاً بالإنجاز
</marquee>
</div>

<script>
// عرض التاريخ
const d = new Date();
document.getElementById("date").innerHTML =
"التاريخ: " + d.toLocaleDateString("ar-SA");

// (اختياري) تطوير لاحق: مواقيت API + عداد الصلاة القادمة
</script>

</body>
</html>
