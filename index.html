<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Rasmalah | رسملة</title>

<style>
body{
    margin:0;
    font-family: Arial;
    color:white;
    background: linear-gradient(135deg,#0b5d3b,#06281f);
    overflow:hidden;
}

/* طبقة ضبابية */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    z-index:-1;
}

/* الشعار */
.logo{
    text-align:center;
    margin-top:15px;
}

.logo img{
    width:200px;
    filter: drop-shadow(0 0 12px #0b5d3b);
}

/* الاسم */
.title{
    text-align:center;
    font-size:26px;
    margin-top:5px;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    font-size:18px;
    opacity:0.8;
}

/* الساعة */
.clock{
    text-align:center;
    font-size:34px;
    margin-top:10px;
    font-weight:bold;
}

/* التاريخ */
.date{
    text-align:center;
    font-size:18px;
    margin-top:5px;
    opacity:0.9;
}

/* المواقيت */
.box{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.prayer{
    background:rgba(255,255,255,0.08);
    padding:12px;
    border-radius:12px;
    min-width:110px;
    text-align:center;
}

.prayer.active{
    background:#22c55e;
}

/* الأذكار */
.ticker{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5d3b;
    padding:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="logo">
    <img src="logo.png">
</div>

<div class="title">مؤسسة رسملة للتسويق والمقاولات</div>
<div class="subtitle">Rasmalah Company for Marketing & Contracting</div>

<div class="clock" id="clock">--</div>
<div class="date" id="date">--</div>

<div class="box">
    <div class="prayer" id="fajr"><h3>الفجر</h3><span></span></div>
    <div class="prayer" id="dhuhr"><h3>الظهر</h3><span></span></div>
    <div class="prayer" id="asr"><h3>العصر</h3><span></span></div>
    <div class="prayer" id="maghrib"><h3>المغرب</h3><span></span></div>
    <div class="prayer" id="isha"><h3>العشاء</h3><span></span></div>
</div>

<audio id="adhan" src="adhan.mp3" preload="auto"></audio>

<div class="ticker">
<marquee>
سبحان الله | الحمد لله | لا إله إلا الله | الله أكبر | استغفر الله العظيم
</marquee>
</div>

<script>

let times = {};
let unlocked = false;
let last = "";

function unlockAudio(){
    const audio = document.getElementById("adhan");
    audio.play().then(()=>{
        audio.pause();
        audio.currentTime = 0;
        unlocked = true;
    }).catch(()=>{});
}

document.addEventListener("click", unlockAudio);

function format12(date){
    let h = date.getHours();
    let m = date.getMinutes();
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;
    return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

function updateClock(){
    document.getElementById("clock").innerText = format12(new Date());
}

function updateDate(){
    const d = new Date();
    document.getElementById("date").innerText =
        d.toLocaleDateString("ar-SA") + " | " + d.toDateString();
}

async function loadTimes(){
    const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4");
    const data = await res.json();
    const t = data.data.timings;

    times = {
        Fajr: t.Fajr,
        Dhuhr: t.Dhuhr,
        Asr: t.Asr,
        Maghrib: t.Maghrib,
        Isha: t.Isha
    };

    for(let p in times){
        document.getElementById(p.toLowerCase()).querySelector("span").innerText = to12(times[p]);
    }
}

function to12(t){
    let [h,m] = t.split(":").map(Number);
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;
    return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

function playAdhan(){
    if(!unlocked) return;

    const audio = document.getElementById("adhan");
    audio.currentTime = 0;
    audio.play().catch(()=>{});
}

function check(){
    let now = new Date();
    let current = now.getHours().toString().padStart(2,'0') + ":" +
                  now.getMinutes().toString().padStart(2,'0');

    for(let p in times){
        if(times[p] === current && last !== p){
            playAdhan();
            last = p;
        }
    }
}

setInterval(updateClock,1000);
setInterval(check,10000);

updateClock();
updateDate();
loadTimes();

</script>

</body>
</html>
